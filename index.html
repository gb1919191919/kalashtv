<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalash TV Display</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* cover ensures the 1920x1080 fills the screen entirely */
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.5);
            font-family: sans-serif;
            font-size: 2vw;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="overlay">Click anywhere to enable audio if needed</div>
    <video id="tv-video" autoplay loop muted playsinline>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        const video = document.getElementById('tv-video');
        const overlay = document.getElementById('overlay');

        // Hide overlay and unmute on first click/tap
        document.body.addEventListener('click', () => {
            if (overlay.style.display !== 'none') {
                overlay.style.display = 'none';
                video.muted = false;
                // If it was paused due to autoplay policy, try to play again
                video.play().catch(e => console.log("Play failed:", e));
            }
        });

        // Some TVs might need this to force autoplay
        window.addEventListener('load', () => {
            video.play().catch(e => {
                console.log("Autoplay prevented, waiting for user interaction");
            });
        });
    </script>
</body>
</html>
